# Default allowlist, shipped with the package. Your own rules belong in a
# later file (say 50-site.toml): drop-ins are read in lexical order and their
# lists add to these. Drop-ins may contain only an [allowlist] table; thresholds,
# scoring and the rest belong in config.toml.

[allowlist]
# Parents whose children skip the "exec from a temp directory" score. Paths
# only, because a process name is whatever the process says it is. They apply
# only when the binary verifies against the RPM database (or a pin below).
excluded_parent_processes = [
    "/usr/bin/ansible-playbook",
    "/usr/bin/dnf",
    "/usr/bin/rpm",
    "/usr/bin/podman",
    "/usr/bin/cargo",
    "/usr/bin/pip3",
]

# Binaries that don't score for calling memfd_create or for executing a
# memfd. runc and crun copy themselves into a memfd and run that on every
# container start. Like the parents above, this list and the two below
# apply only to binaries that verify.
memfd_callers = [
    "/usr/bin/podman",
    "/usr/bin/pipewire",
    "/usr/bin/gnome-shell",
    "/usr/bin/runc",
    "/usr/bin/crun",
    # systemd 255 and later pass each unit's settings to systemd-executor
    # in a memfd, so pid 1 and every user manager create one per start.
    "/usr/lib/systemd/systemd",
    # Creates memfds as it serves; Rocky 10 cloud images ship it enabled.
    "/usr/libexec/cockpit-tls",
]

# Debuggers that may attach to a system daemon without scoring.
ptrace_tracers = [
    "/usr/bin/gdb",
    "/usr/bin/strace",
    "/usr/bin/perf",
]

# Scanners that don't score for an egress scan, but only when run by root
# from a terminal: someone is at the keyboard.
scan_binaries = ["/usr/bin/nmap"]

# Confined SELinux domains to trust: their processes skip the temp-directory
# exec and memfd_create scores. Empty on purpose; for example:
#   excluded_selinux_domains = ["rpm_t"]
# Never add unconfined_t: every root shell runs in it.
excluded_selinux_domains = []
