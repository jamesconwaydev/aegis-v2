# SPDX-License-Identifier: MIT OR Apache-2.0
#
# End-to-end scenarios for `cargo xtask e2e`. Each one runs a command on
# the test host, then the harness checks what aegisd recorded against
# `expect`: "none" for no incident, or the verdict the single incident
# must carry (exactly one incident). `aegis-sim` is this repo's test-only
# simulator.
#
# Incidents are cleared between scenarios, so each is judged alone. A
# scenario whose command exits non-zero fails.
#
# `mode` is "audit" (the default) or "enforce": an enforce scenario runs
# with the config switched to enforce, and expects "throttled" or
# "quarantined" where audit expects "would_...". Afterwards the harness
# kills each quarantined incident and releases each throttled one, puts
# the config back and removes whatever is left. `check`, if given, runs
# under `set -e` once the verdict settles and must exit 0.
#
# The harness installs aegis-sim at two paths: /usr/local/bin/aegis-sim,
# for scenarios that test a signal on its own, and /tmp/aegis-sim, so a
# scenario that should also carry the "exec from a temp directory" signal
# (25) gets it from its own exec.
#
# The ptrace steps use the real strace (a harness prerequisite), copied
# to a fresh file under /tmp: a new inode, so it is unverified and its
# exec comes from a temp directory. `timeout 2` stops it with SIGTERM,
# on which strace detaches cleanly and timeout exits 124. The target is
# the sshd listener, a system.slice service, so it counts as a system
# daemon; the guard refuses pid 0 or 1.

# --- Attack simulators ---------------------------------------------------

[[scenario]]
name = "tmp-dropper"
run = "/usr/local/bin/aegis-sim tmp-dropper"
# The dropped payload execs from /tmp for a lone 25, below the throttle
# threshold, so nothing is recorded.
expect = "none"

[[scenario]]
name = "memfd-exec"
run = "/usr/local/bin/aegis-sim memfd-exec"
# memfd_create (20) + exec of a memfd (65) = 85 on one process, a
# margin over 80 that the few ms of decay between the two cannot erase.
expect = "would_quarantine"

[[scenario]]
name = "ptrace-daemon"
run = """
S=/tmp/aegis-strace.$$; P=$(systemctl show -p MainPID --value sshd)
[ "$P" -gt 1 ] && cp /usr/bin/strace $S || exit 1
timeout 2 $S -e trace=none -p $P; rc=$?; rm -f $S; [ $rc = 124 ]
"""
# The strace copy: exec from /tmp (25) + ptrace a system daemon (45) = 70.
expect = "would_throttle"

[[scenario]]
name = "port-scan"
run = "/usr/local/bin/aegis-sim port-scan --target 127.0.0.0/8"
# An egress scan alone is 40, below the throttle threshold.
expect = "none"

[[scenario]]
name = "chain"
run = """
S=/tmp/aegis-strace.$$; P=$(systemctl show -p MainPID --value sshd)
[ "$P" -gt 1 ] && cp /usr/bin/strace $S || exit 1
/tmp/aegis-sim chain timeout 2 $S -e trace=none -p $P; rc=$?; rm -f $S; [ $rc = 124 ]
"""
# exec from /tmp (25) + egress scan (40) on aegis-sim, then the ptrace
# step last, as its child: the strace copy's own tmp exec (25) + ptrace
# a system daemon (45). One incident: 25 + 40 + 45 = 110.
expect = "would_quarantine"

[[scenario]]
name = "preload-memfd"
run = """
D=/etc/aegis-v2/allowlist.d/99-e2e-sim.toml
H=$(sha256sum /usr/local/bin/aegis-sim | cut -d' ' -f1)
printf '[allowlist]\nmemfd_callers = ["/usr/local/bin/aegis-sim"]\n[allowlist.pinned]\n"/usr/local/bin/aegis-sim" = "%s"\n' "$H" > $D
systemctl reload aegisd && sleep 2
LD_PRELOAD=/usr/lib64/libc.so.6 /usr/local/bin/aegis-sim memfd-exec --wait-ms 500; rc=$?
rm -f $D; systemctl reload aegisd; [ $rc = 0 ]
"""
# aegis-sim, pinned and listed as a memfd caller for this scenario only,
# so it verifies and its memfd_create (20) and memfd exec (65) would be
# forgiven. LD_PRELOAD in its environment withholds that: 85.
expect = "would_quarantine"

[[scenario]]
name = "pinned-memfd"
run = """
D=/etc/aegis-v2/allowlist.d/99-e2e-sim.toml
H=$(sha256sum /usr/local/bin/aegis-sim | cut -d' ' -f1)
printf '[allowlist]\nmemfd_callers = ["/usr/local/bin/aegis-sim"]\n[allowlist.pinned]\n"/usr/local/bin/aegis-sim" = "%s"\n' "$H" > $D
systemctl reload aegisd && sleep 2
/usr/local/bin/aegis-sim memfd-exec --wait-ms 500; rc=$?
rm -f $D; systemctl reload aegisd; [ $rc = 0 ]
"""
# The same, without the preload: the control for the scenario above.
# The kernel reads the environment at exec, so this passes however
# quickly the process exits. Both still wait 500 ms before the memfd.
expect = "none"

# --- Benign activity that must not trip a detection ----------------------

[[scenario]]
name = "dnf-install"
run = "dnf -y install tree && dnf -y remove tree"
# dnf is an allowlisted parent, so its temp-dir execs are forgiven.
expect = "none"

[[scenario]]
name = "gdb-attach"
# A real debugger attaching to sshd, as root at a terminal. gdb is an
# allowlisted, RPM-verified tracer, so the ptrace is forgiven.
run = "script -qec 'gdb -p $(pidof sshd | cut -d\" \" -f1) -batch -ex detach -ex quit' /dev/null"
expect = "none"

[[scenario]]
name = "pip-download"
run = "python3 -m pip download --no-input --dest /tmp/aegis-pipdl requests && rm -rf /tmp/aegis-pipdl"
# A pure-wheel download execs nothing from a temp directory.
expect = "none"

[[scenario]]
name = "podman-run"
run = "podman run --rm registry.access.redhat.com/ubi10/ubi-micro true"
# crun copies itself into a memfd on every start; it is allowlisted.
expect = "none"

[[scenario]]
name = "ssh-login"
# The harness runs every scenario over a fresh SSH connection, so this
# command alone exercises a full sshd login and session.
run = "true"
expect = "none"

# --- Enforce mode ----------------------------------------------------------
#
# The process under test has to outlive its verdict, so it runs detached
# (setsid -f) with `--stay`, and writes its pid to /run/aegis-sim.pid.
#
# The ptrace steps here attach to a throwaway system service, not sshd:
# a quarantine freezes the tracer, and sshd's listener would stop at its
# next syscall waiting on it, taking every new login with it.
#
# A check refuses every pid or id it reads before using it: `case $P in
# ''|*[!0-9]*) exit 1` fails on an empty answer and on more than one,
# so a missing process can never make a check pass by default.

[[scenario]]
name = "quarantine-memfd-enforce"
mode = "enforce"
run = """
rm -f /run/aegis-sim.pid
setsid -f /usr/local/bin/aegis-sim memfd-exec --stay 30 </dev/null >/dev/null 2>&1
timeout 5 sh -c 'until [ -s /run/aegis-sim.pid ]; do sleep 0.1; done'
"""
expect = "quarantined"
check = """
P=$(cat /run/aegis-sim.pid)
case $P in ''|*[!0-9]*) exit 1 ;; esac
CG=$(sed -n 's/^0:://p' /proc/$P/cgroup)
case $CG in */aegis-quarantine.slice/aegis-incident-*-q.scope) ;; *) exit 1 ;; esac
grep -qx 'frozen 1' /sys/fs/cgroup$CG/cgroup.events
[ "$(nft list table inet aegis | grep -c ' drop$')" = 1 ]
"""

[[scenario]]
name = "quarantine-chain-enforce"
mode = "enforce"
run = """
rm -f /run/aegis-sim.pid; S=/tmp/aegis-strace.$$
systemd-run --quiet --unit=aegis-e2e-target sleep 300 || exit 1
P=$(systemctl show -p MainPID --value aegis-e2e-target)
[ "$P" -gt 1 ] && cp /usr/bin/strace $S || exit 1
setsid -f /tmp/aegis-sim chain --stay 30 timeout 30 $S -e trace=none -p $P </dev/null >/dev/null 2>&1
timeout 5 sh -c 'until [ -s /run/aegis-sim.pid ]; do sleep 0.1; done'
"""
# As `chain`: aegis-sim's 25 + 40 throttles it, then the strace copy's
# 25 + 45 takes the incident to 110 and the whole tree is quarantined:
# aegis-sim, timeout under it and the strace under that.
expect = "quarantined"
check = """
cg() { sed -n 's/^0:://p' /proc/$1/cgroup; }
T=$(pgrep -f '^/tmp/aegis-strace[.]')
case $T in ''|*[!0-9]*) exit 1 ;; esac
PP=$(ps -o ppid= -p $T | tr -d ' ')
case $PP in ''|*[!0-9]*) exit 1 ;; esac
P=$(cat /run/aegis-sim.pid)
case $P in ''|*[!0-9]*) exit 1 ;; esac
CG=$(cg $T)
case $CG in */aegis-quarantine.slice/aegis-incident-*-q.scope) ;; *) exit 1 ;; esac
[ "$(cg $PP)" = "$CG" ]
[ "$(cg $P)" = "$CG" ]
grep -qx 'frozen 1' /sys/fs/cgroup$CG/cgroup.events
"""

[[scenario]]
name = "throttle-ptrace-enforce"
mode = "enforce"
run = """
S=/tmp/aegis-strace.$$
systemd-run --quiet --unit=aegis-e2e-target sleep 300 || exit 1
P=$(systemctl show -p MainPID --value aegis-e2e-target)
[ "$P" -gt 1 ] && cp /usr/bin/strace $S || exit 1
setsid -f timeout 30 $S -e trace=none -p $P </dev/null >/dev/null 2>&1
"""
# As `ptrace-daemon`, 70, with the tracer staying attached. 25% of a CPU
# is a 25 ms quota in each 100 ms period.
expect = "throttled"
check = """
T=$(pgrep -f '^/tmp/aegis-strace[.]')
case $T in ''|*[!0-9]*) exit 1 ;; esac
CG=$(sed -n 's/^0:://p' /proc/$T/cgroup)
case $CG in */aegis-throttle.slice/aegis-incident-*.scope) ;; *) exit 1 ;; esac
[ "$(cat /sys/fs/cgroup$CG/cpu.max)" = "25000 100000" ]
"""

[[scenario]]
name = "release-enforce"
mode = "enforce"
run = """
rm -f /run/aegis-sim.pid
setsid -f /usr/local/bin/aegis-sim memfd-exec --stay 60 </dev/null >/dev/null 2>&1
for i in $(seq 30); do
  I=$(aegisctl incidents list | awk '$2 == "quarantined" {print $1}')
  [ -n "$I" ] && break; sleep 0.5
done
[ -n "$I" ] && aegisctl incidents release $I
"""
# The verdict stays "quarantined"; the release is an action on it.
expect = "quarantined"
check = """
P=$(cat /run/aegis-sim.pid)
case $P in ''|*[!0-9]*) exit 1 ;; esac
kill -0 $P
CG=$(sed -n 's/^0:://p' /proc/$P/cgroup)
case $CG in */aegis-quarantine.slice/aegis-incident-*-q.scope) ;; *) exit 1 ;; esac
grep -qx 'frozen 0' /sys/fs/cgroup$CG/cgroup.events
[ "$(nft list table inet aegis 2>/dev/null | grep -c ' drop$')" = 0 ]
"""

[[scenario]]
name = "kill-enforce"
mode = "enforce"
run = """
rm -f /run/aegis-sim.pid
setsid -f /usr/local/bin/aegis-sim memfd-exec --stay 60 </dev/null >/dev/null 2>&1
for i in $(seq 30); do
  I=$(aegisctl incidents list | awk '$2 == "quarantined" {print $1}')
  [ -n "$I" ] && break; sleep 0.5
done
[ -n "$I" ] && aegisctl incidents kill $I
"""
expect = "quarantined"
check = """
P=$(cat /run/aegis-sim.pid)
case $P in ''|*[!0-9]*) exit 1 ;; esac
I=$(aegisctl incidents list | awk '$2 == "quarantined" {print $1}')
case $I in AEG-*) ;; *) exit 1 ;; esac
case $I in *[!A-Za-z0-9-]*) exit 1 ;; esac
U=aegis-incident-$I-q.scope
timeout 5 sh -c "while kill -0 $P || systemctl is-active -q $U; do sleep 0.1; done" 2>/dev/null
# Kill looks the rule up before the scope's cgroup goes, so it's deleted,
# not left behind under a bare cgroup id.
[ "$(nft list table inet aegis 2>/dev/null | grep -c ' drop$')" = 0 ]
"""

[[scenario]]
name = "nft-reload-enforce"
mode = "enforce"
run = """
set -e
rm -f /run/aegis-sim.pid
setsid -f /usr/local/bin/aegis-sim memfd-exec --stay 150 </dev/null >/dev/null 2>&1
for i in $(seq 30); do
  I=$(aegisctl incidents list | awk '$2 == "quarantined" {print $1}')
  [ -n "$I" ] && break; sleep 0.5
done
case $I in AEG-*) ;; *) exit 1 ;; esac
case $I in *[!A-Za-z0-9-]*) exit 1 ;; esac
S=aegis-incident-$I-q.scope
h() { nft -a list chain inet aegis out | grep -F -- "$1" | sed -n 's/.*# handle //p'; }
H=$(h $S)
case $H in ''|*[!0-9]*) exit 1 ;; esac
# Started here only if it wasn't running, and then stopped again. The
# reload flushes the whole ruleset, podman's netavark table included;
# it comes back only when a later scenario (podman-run-enforce) runs a
# container.
if ! systemctl is-active -q nftables; then
  systemctl start nftables; trap 'systemctl stop nftables' EXIT
fi
systemctl reload nftables
nft list table inet aegis >/dev/null 2>&1 && exit 1
# Another rule takes the freed handle before the next 10-second check.
nft add table inet aegis
nft add chain inet aegis out '{ type filter hook output priority 0; policy accept; }'
nft add rule inet aegis out meta mark 0x0ae91500 counter
[ "$(h 'mark 0x0ae91500')" = "$H" ]
timeout 25 sh -c "until nft list chain inet aegis out | grep -qF $S; do sleep 1; done"
aegisctl incidents show $I | grep -qF 're-added after the rule was removed'
aegisctl incidents release $I
nft list chain inet aegis out | grep -qF $S && exit 1
[ "$(h 'mark 0x0ae91500')" = "$H" ]
"""
# One re-check (every 10 s) puts the rule back; release then removes that rule,
# by its new handle, and leaves the stranger holding the old one.
expect = "quarantined"

[[scenario]]
name = "dnf-install-enforce"
mode = "enforce"
run = "dnf -y install tree && dnf -y remove tree"
expect = "none"

[[scenario]]
name = "podman-run-enforce"
mode = "enforce"
run = "podman run --rm registry.access.redhat.com/ubi10/ubi-micro true"
expect = "none"

[[scenario]]
name = "ssh-login-enforce"
mode = "enforce"
run = "true"
expect = "none"
