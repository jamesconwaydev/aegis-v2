<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d">
  <title id="t">Aegis v2</title>
  <desc id="d">The Aegis v2 wordmark beside a shield, with a scan line passing over it. Runtime threat detection for Rocky Linux 10, built on eBPF.</desc>
  <style>
    /* Mid-tone colours on a transparent background: they read on GitHub's
       light and dark themes alike, whatever the viewer's OS prefers. */
    :root { --ink: #2f81f7; --muted: #8b949e; --accent: #2f81f7; --glow: #2da44e; --grid: #8b949e; }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .accent { fill: var(--accent); }
    .glow { fill: var(--glow); }
    .stroke { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linejoin: round; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .word { font: 700 104px/1 ui-sans-serif, -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 6px; }
    .ver { font: 600 40px/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .tag { font: 400 28px/1.3 ui-sans-serif, -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .scan { fill: var(--glow); opacity: 0.55; animation: sweep 4.5s ease-in-out infinite; }
    .pulse { animation: pulse 4.5s ease-in-out infinite; transform-origin: 170px 140px; }
    .blink { fill: var(--glow); animation: blink 1.5s steps(2, start) infinite; }
    @keyframes sweep { 0% { transform: translateY(-78px); opacity: 0; } 15% { opacity: 0.55; } 85% { opacity: 0.55; } 100% { transform: translateY(96px); opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
      .scan, .pulse, .blink { animation: none; }
      .scan { opacity: 0; }
    }
  </style>
  <defs>
    <clipPath id="shield">
      <path d="M170 40 L250 70 V140 C250 190 215 222 170 240 C125 222 90 190 90 140 V70 Z"/>
    </clipPath>
  </defs>
  <g class="grid">
    <line x1="330" y1="208" x2="1110" y2="208"/>
  </g>
  <g class="pulse">
    <path class="stroke" d="M170 40 L250 70 V140 C250 190 215 222 170 240 C125 222 90 190 90 140 V70 Z"/>
    <path class="accent" d="M170 92 L206 106 V140 C206 163 191 178 170 187 C149 178 134 163 134 140 V106 Z" opacity="0.9"/>
  </g>
  <g clip-path="url(#shield)">
    <rect class="scan" x="80" y="118" width="180" height="6" rx="3"/>
  </g>
  <text class="word ink" x="330" y="160">AEGIS</text>
  <text class="ver glow" x="694" y="160">v2</text>
  <text class="tag muted" x="332" y="250">eBPF runtime threat detection for Rocky Linux 10</text>
  <rect class="blink" x="966" y="228" width="14" height="26"/>
</svg>
