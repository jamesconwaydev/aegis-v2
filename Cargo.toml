[workspace]
resolver = "2"
members = ["aegis-common", "aegis-ebpf", "aegis-proto", "aegisd", "aegisctl", "aegis-sim", "xtask"]
# aegis-ebpf only builds for the BPF target, via aegisd's build script.
# aegis-sim is a Linux-only test tool, built explicitly by the e2e task.
default-members = ["aegis-common", "aegis-proto", "aegisd", "aegisctl", "xtask"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jamesconwaydev/aegis-v2"

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }

anyhow = { version = "1", default-features = false }
cargo_metadata = { version = "0.23.0", default-features = false }
clap = { version = "4.5.20", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
tokio = { version = "1", default-features = false }
which = { version = "6.0.0", default-features = false }

[profile.release.package.aegis-ebpf]
debug = 2
codegen-units = 1
strip = false
