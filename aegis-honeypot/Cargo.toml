[package]
name = "aegis-honeypot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aegis-proto = { path = "../aegis-proto" }

anyhow = { workspace = true, features = ["std"] }
# Parsing and building only: no resolver, no DNSSEC, no network I/O.
hickory-proto = { version = "0.26.3", default-features = false }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# cargo fuzz sets cfg(fuzzing); see src/lib.rs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
