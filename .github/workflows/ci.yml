name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Docs-only changes skip the Rust jobs. A job skipped by `if` still
  # counts as passing for a required check, so those PRs can merge.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            rust:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  # rustfmt and cargo-deny never run a build script, so these two skip
  # the image and use the runner's rustup with rust-toolchain.toml.
  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DENY: "0.20.2"
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: |
          d=cargo-deny-$DENY-x86_64-unknown-linux-musl
          curl -sSfLo "$RUNNER_TEMP/$d.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY/$d.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/$d.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$d.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 "$d/cargo-deny"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: cargo deny --locked check

  # aegisd's build script compiles the eBPF crate with the image's
  # nightly and bpf-linker, so everything that builds runs in the image.
  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          arch: x86_64
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ hashFiles('build/Containerfile') }}
          cache-bin: "false"
      - run: .github/in-image.sh 'cargo clippy --locked --all-targets -- -D warnings'

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          arch: x86_64
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ hashFiles('build/Containerfile') }}
          cache-bin: "false"
      - run: .github/in-image.sh 'cargo test --locked'

  # Builds aegisd, which builds the probes, and checks what came out is
  # a BPF object.
  ebpf-build:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          arch: x86_64
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ hashFiles('build/Containerfile') }}
          cache-bin: "false"
      # The script runs in the container, so its $f stays unexpanded here.
      - run: |
          # shellcheck disable=SC2016
          .github/in-image.sh '
            cargo build --locked -p aegisd -p aegisctl &&
            for f in target/debug/build/aegisd-*/out/aegis; do
              echo "$f" && llvm-readelf -h "$f" | grep -q "Machine: *EM_BPF" || exit 1
            done'

  rpm:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          arch: x86_64
      - run: cargo xtask rpm --arch x86_64
        env:
          AEGIS_CONTAINER_ENGINE: docker
      - run: ls -l dist/rpm

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          jobSummary: false
