name: Wiki

# docs/ is the source; the wiki is a copy of it as of the latest release,
# so what people browse matches what they can install.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # the wiki is a git repository under the same token
    steps:
      # A release for an older line, published after a newer one, must not
      # roll the wiki back. Prereleases count: every v0.x release is one.
      - name: Check this is the newest release
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != release ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # sort -V ranks v0.3.0-rc1 above v0.3.0; a pre-release suffix
          # must rank below its final, so swap the dash for a tilde,
          # which sorts before everything, and swap it back.
          newest=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName --jq '.[].tagName' | sed 's/-/~/' | sort -V | tail -1 | sed 's/~/-/')
          if [ "$newest" = "$TAG" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG isn't the newest release ($newest); the wiki stays as it is."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.newest.outputs.go == 'true'
        with:
          persist-credentials: false
      # The token travels as a header on clone and push only, so it never
      # lands in the wiki checkout's .git/config.
      - name: Clone the wiki
        if: steps.newest.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone --depth 1 \
            "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki \
            || { echo "::error::No wiki to push to. Create its first page on GitHub, then rerun."; exit 1; }
      - name: Copy docs into wiki pages
        if: steps.newest.outputs.go == 'true'
        env:
          REF: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          python3 -I .github/wiki.py --check
          python3 -I .github/wiki.py docs wiki "$REF"
      - name: Push
        if: steps.newest.outputs.go == 'true'
        working-directory: wiki
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          git add -A
          if git diff --cached --quiet; then echo "wiki already current"; exit 0; fi
          git -c user.name="James Conway" \
              -c user.email="148910373+jamesconwaydev@users.noreply.github.com" \
              commit -q -m "Docs as of $REF"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push -q origin HEAD
