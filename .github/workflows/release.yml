name: Release

on:
  push:
    tags: ["v*.*.*"]
  # A dry run from a branch: every check and both RPM builds, no release.
  workflow_dispatch:

# One run per tag, and a second push of the same tag waits rather than
# cancelling a release halfway through publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Everything that can stop a release, before any build starts.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the versions agree
        run: |
          fail() { echo "::error::$*"; exit 1; }
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          spec=packaging/aegis-v2.spec
          grep -q '^Version: *%{aegis_version}$' "$spec" \
            || fail "$spec must take Version from aegis_version (Cargo.toml)"
          entry=$(sed -n '/^%changelog/{n;s/.* - \([^ ]*\)-[^-]*$/\1/p;q;}' "$spec")
          test "$entry" = "$version" \
            || fail "$spec %changelog starts at $entry, Cargo.toml is $version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" \
              || fail "tag $GITHUB_REF_NAME, Cargo.toml $version"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || fail "$GITHUB_REF_NAME is not on main"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # The notes are this version's CHANGELOG section, and there must be
      # one: a release without notes fails here, before anything builds.
      - name: Extract release notes
        run: |
          awk -v h="## [$VERSION]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md \
            || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error
          retention-days: 7

  rpm:
    needs: check
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            # The noarch SELinux RPM comes out of both builds; ship one.
            files: dist/rpm/*.rpm
          - arch: aarch64
            runner: ubuntu-24.04-arm
            files: dist/rpm/*.aarch64.rpm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          arch: ${{ matrix.arch }}
      # xtask runs on the host, so the runner image must carry rustup.
      - name: Check for rustup
        run: command -v rustup || { echo "::error::no rustup on ${{ matrix.runner }}"; exit 1; }
      - run: cargo xtask rpm --arch ${{ matrix.arch }}
        env:
          AEGIS_CONTAINER_ENGINE: docker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-${{ matrix.arch }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  # Publishes a draft. Releases are immutable once published, so I read the
  # draft over, then publish it by hand.
  publish:
    needs: [check, rpm]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rpm-*
          path: out
          merge-multiple: true
      # One SBOM for the Rust dependency tree (Cargo.lock), in both formats.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: Cargo.lock
          format: spdx-json
          output-file: out/aegis-v2-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: Cargo.lock
          format: cyclonedx-json
          output-file: out/aegis-v2-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write SHA256SUMS
        working-directory: out
        run: sha256sum -- *.rpm *.json | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: out/SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: the bundle ties SHA256SUMS to this workflow run.
      - name: Sign SHA256SUMS
        working-directory: out
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "$GITHUB_REF_NAME" in v0.* | *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md $pre out/*
