name: Feature request
description: Suggest something Aegis should do.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Start with the problem you have today, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
  - type: input
    id: version
    attributes:
      label: Aegis version
      description: Optional, but useful if it's about existing behaviour.
