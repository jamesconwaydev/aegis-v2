name: Detection report
description: Aegis missed something it should have caught, or you have a new behaviour worth detecting.
labels: [detection, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What should have been detected?
      description: Describe the behaviour and how you triggered it. Only test on systems you own.
    validations:
      required: true
  - type: input
    id: rocky
    attributes:
      label: Rocky Linux version
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel
      description: Output of `uname -r`.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Aegis version
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Mode
    validations:
      required: true
  - type: textarea
    id: preflight
    attributes:
      label: "`aegisctl preflight` output"
      render: text
    validations:
      required: true
  - type: textarea
    id: incident
    attributes:
      label: Relevant incident JSON
      description: If Aegis logged anything at all, paste it. Remove anything sensitive first.
      render: json
