version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    # The composite action pins its own actions; "/" alone misses it.
    directories: [/, /.github/actions/build-image]
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    # The ClusterFuzzLite builder image, pinned by digest.
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
