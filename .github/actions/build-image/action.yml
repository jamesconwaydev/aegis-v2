name: Build image
description: >
  Builds aegis-build:rocky10-<arch> from build/Containerfile with its
  layers in the Actions cache, and loads it into the runner's docker.
  Nothing is pushed anywhere.
inputs:
  arch:
    description: x86_64 or aarch64, matching the runner
    required: true
runs:
  using: composite
  steps:
    # The same label xtask stamps, so `cargo xtask` takes this image as
    # current instead of rebuilding it.
    - id: hash
      shell: bash
      run: echo "sha=$(sha256sum build/Containerfile | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: build
        file: build/Containerfile
        load: true
        provenance: false
        tags: aegis-build:rocky10-${{ inputs.arch }}
        labels: aegis.containerfile=${{ steps.hash.outputs.sha }}
        cache-from: type=gha,scope=rocky10-${{ inputs.arch }}
        cache-to: type=gha,mode=max,scope=rocky10-${{ inputs.arch }}
